    - assets/images/ei-logo.gif
  prohibited_text_patterns:
    - Entertainment Intelligence and Human-Centered AI Labs
  required_footer_text:
    - Georgia Institute of Technology

migration:
  rewrite_internal_http_links: true
  include_bibtex_details: true
