# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.
#
# If you need help with YAML syntax, here are some quick references for you: 
# https://learn-the-web.algonquindesign.ca/topics/markdown-yaml-cheat-sheet/#yaml
# https://learnxinyminutes.com/docs/yaml/
#
# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.

title: "Human-Centered AI Lab"
email: riedl@cc.gatech.edu
description: "Human-Centered AI Lab (formerly Entertainment Intelligence) at Georgia Tech: research on computational narrative, responsible AI, agents, and computational creativity."
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://eilab.gatech.edu" # the base hostname & protocol for your site, e.g. http://example.com
twitter_username: mark_riedl
github_username:  eilab-gt

# Build settings
remote_theme: "mmistakes/minimal-mistakes@4.23.0"
plugins:
  - jekyll-feed
  - jekyll-include-cache

minimal_mistakes_skin: "contrast"
masthead_title: "Human-Centered AI Lab"
subtitle: "formerly Entertainment Intelligence"
logo: "/assets/images/hcai-lab-mark.svg"
twitter:
  username: "mark_riedl"
og_image: /assets/images/og-card.png
footer:
  links:
    - label: "Mastodon"
      icon: "fab fa-mastodon"
      url: "https://sigmoid.social/@Riedl"
    - label: "Twitter"
      icon: "fab fa-fw fa-twitter-square"
      url: "https://twitter.com/mark_riedl"
    - label: "LinkedIn"
      icon: "fab fa-linkedin"
      url: https://www.linkedin.com/in/markriedl/
    - label: "BlueSky"
      icon: "fa-brands fa-bluesky"
      url: https://bsky.app/profile/markriedl.bsky.social
#    - label: "GitHub"
#      icon: "fab fa-fw fa-github"
#      url: "https://github.com/mmistakes"
#    - label: "Instagram"
#      icon: "fab fa-fw fa-instagram"
#      url: "https://instagram.com/mmistakes"
defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      read_time: true
      classes: wide
      layout: single






# Exclude from processing: repository tooling and notes that are not site
# content. GitHub Pages runs Jekyll 3.10, where this list replaces Jekyll's
# defaults instead of adding to them, so the defaults are repeated first.
# CNAME is listed because the github-pages gem only excludes it on its own
# when this list is left at Jekyll's default. lab.bib stays published.
exclude:
  - CNAME
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - README.md
  - TODOS.md
  - bib2yaml.sh
  - bib2yaml_workflow.sh
  - bib2yml.py
  - fix.py
  - fold.py
  - wordpress-migration/

include: ["_pages"]
